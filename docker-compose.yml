services:
  game-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freibahn
    ports:
      - "90:90"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:90/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "com.freibahn.description=Freibahn Browser Gaming Portal"
      - "com.freibahn.version=1.0.0"
